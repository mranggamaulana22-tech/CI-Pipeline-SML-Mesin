name: MLflow Retraining Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Run actions/checkout@v4
      uses: actions/checkout@v4

    - name: 2. Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Check Env & Install Dependencies
      run: |
        echo "Checking environment..."
        python --version
        pip --version
        pip install mlflow dagshub pandas scikit-learn matplotlib seaborn

    - name: 4. Set MLflow Tracking URI & Run MLflow Project
      env:
        MLFLOW_TRACKING_URI: https://dagshub.com/mranggamaulana22/Eksperimen_SML_Rangga-Maulana-Insani.mlflow
        MLFLOW_TRACKING_USERNAME: mranggamaulana22
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        # Melakukan autentikasi resmi via CLI dagshub sebelum run
        dagshub login --token ${{ secrets.DAGSHUB_TOKEN }}
        
        # Eksekusi retraining mlflow project
        mlflow run MLProject --env-manager local

    - name: 5. Install Python dependencies for Artifacts
      run: |
        pip install --upgrade pip

    - name: 6. Upload to GitHub (Save MLflow Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-local-artifacts
        path: mlruns/
